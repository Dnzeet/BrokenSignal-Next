name: Build Firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install -U platformio esptool

      - name: Build firmware
        run: pio run -e m5stack-stamps3

      - name: Locate build outputs
        id: outputs
        run: |
          BUILD_DIR=.pio/build/m5stack-stamps3
          echo "build_dir=$BUILD_DIR" >> "$GITHUB_OUTPUT"
          ls -la "$BUILD_DIR"

      - name: Merge full flash image
        run: |
          BUILD_DIR=${{ steps.outputs.outputs.build_dir }}
          python -m esptool --chip esp32s3 merge_bin \
            -o "$BUILD_DIR/firmware-merged.bin" \
            --flash_mode dio --flash_freq 80m --flash_size 8MB \
            0x0000 "$BUILD_DIR/bootloader.bin" \
            0x8000 "$BUILD_DIR/partitions.bin" \
            0xe000 "$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin" \
            0x10000 "$BUILD_DIR/firmware.bin"

      - name: Package release zip
        run: |
          BUILD_DIR=${{ steps.outputs.outputs.build_dir }}
          mkdir -p out
          cp "$BUILD_DIR/firmware.bin" out/
          cp "$BUILD_DIR/firmware-merged.bin" out/
          cp "$BUILD_DIR/bootloader.bin" out/
          cp "$BUILD_DIR/partitions.bin" out/
          cd out && zip -r ../BrokenSignal-Next-firmware.zip .

      - name: Upload firmware zip
        uses: actions/upload-artifact@v4
        with:
          name: BrokenSignal-Next-firmware
          path: BrokenSignal-Next-firmware.zip
